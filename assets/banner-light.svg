<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Rao Abid Saleem — Full-Stack Developer (MERN + NestJS)</title>
  <desc id="desc">A banner with the name Rao Abid Saleem, the role full-stack developer, focus areas, and a terminal showing the primary stack.</desc>

  <defs>
    <linearGradient id="brand" x1="64" y1="120" x2="420" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669"/>
      <stop offset="0.55" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="0.5" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(1060 20) rotate(128) scale(460 340)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="24"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#F8FAFC"/>
    <rect width="1200" height="320" fill="url(#grid)" opacity="0.65"/>
    <rect width="1200" height="320" fill="url(#halo)"/>
    <rect width="1200" height="4" fill="url(#topline)"/>

    <circle cx="1132" cy="286" r="128" stroke="#A7F3D0" stroke-opacity="0.55"/>
    <circle cx="1132" cy="286" r="90" stroke="#A5F3FC" stroke-opacity="0.5"/>

    <rect x="64" y="42" width="346" height="30" rx="15" fill="#ECFDF5" stroke="#A7F3D0"/>
    <circle cx="82" cy="57" r="4" fill="#22C55E"/>
    <text x="96" y="61.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#047857">FULL-STACK DEVELOPER · MERN + NESTJS</text>

    <text x="62" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-2" fill="#0F172A">Rao Abid</text>
    <text x="62" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-2" fill="url(#brand)">Saleem</text>

    <text x="64" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="450" fill="#475569">Building multi-tenant SaaS end to end, from database to dashboard.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="500">
      <rect x="64" y="266" width="78" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="103" y="284" text-anchor="middle" fill="#334155">MongoDB</text>
      <rect x="150" y="266" width="78" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="189" y="284" text-anchor="middle" fill="#334155">Express</text>
      <rect x="236" y="266" width="62" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="267" y="284" text-anchor="middle" fill="#334155">React</text>
      <rect x="306" y="266" width="78" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="345" y="284" text-anchor="middle" fill="#334155">Node.js</text>
      <rect x="392" y="266" width="70" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="427" y="284" text-anchor="middle" fill="#334155">NestJS</text>
      <rect x="470" y="266" width="94" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="517" y="284" text-anchor="middle" fill="#334155">TypeScript</text>
    </g>

    <g filter="url(#cardShadow)">
      <rect x="728" y="56" width="408" height="210" rx="18" fill="#0B1120"/>
    </g>
    <rect x="728.5" y="56.5" width="407" height="209" rx="17.5" stroke="#22304A"/>
    <circle cx="752" cy="80" r="5" fill="#FF5F57"/>
    <circle cx="770" cy="80" r="5" fill="#FEBC2E"/>
    <circle cx="788" cy="80" r="5" fill="#28C840"/>
    <text x="1112" y="84" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#64748B">rao@dev : ~/workspace</text>
    <line x1="728" y1="100" x2="1136" y2="100" stroke="#1E293B"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
      <text x="752" y="130" fill="#64748B">$ whoami</text>
      <text x="752" y="154" fill="#E2E8F0">full-stack developer</text>
      <text x="752" y="184" fill="#64748B">$ stack --focus</text>
      <text x="752" y="208" fill="#6EE7B7">mern · nestjs · typescript</text>
      <text x="752" y="238" fill="#64748B">$ status</text>
      <text x="752" y="261" fill="#38BDF8">shipping in production</text>
    </g>
    <rect x="936" y="249" width="7" height="14" rx="1" fill="#38BDF8"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></rect>

    <rect x="0.5" y="0.5" width="1199" height="319" rx="23.5" stroke="#E2E8F0"/>
    <rect x="0.5" y="0.5" width="1199" height="319" rx="23.5" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-dasharray="700 2296" opacity="0.22" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="0" to="2996" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="0.5" y="0.5" width="1199" height="319" rx="23.5" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-dasharray="460 2536" opacity="0.45" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="0" to="2996" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="0.5" y="0.5" width="1199" height="319" rx="23.5" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-dasharray="260 2736" opacity="1.0" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="0" to="2996" dur="6s" repeatCount="indefinite"/></rect>

  </g>
</svg>
